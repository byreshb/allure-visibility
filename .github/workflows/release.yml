name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify tag matches pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -q -Dexpression=project.version -DforceStdout --non-recursive org.apache.maven.plugins:maven-help-plugin:3.5.0:evaluate)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pom version ($POM_VERSION)"
            exit 1
          fi

      - name: Build
        run: mvn -B package -DskipTests

      - name: Extract release notes
        run: |
          awk '/^## \[/{if (found) exit; found=1; next} found' CHANGELOG.md > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: '**/target/*.jar'
